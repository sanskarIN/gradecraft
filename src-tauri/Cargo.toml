[package]
name = "gradecraft"
version = "2.0.12"
description = "Privacy-first student grade calculator for web, desktop, and mobile."
authors = ["Sanskar <sanskarin@outlook.in>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sanskarIN/gradecraft"

[lib]
name = "gradecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
