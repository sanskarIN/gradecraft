name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run verify
      - run: npm run build
      - run: cd dist && zip -r ../gradecraft-pwa.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: gradecraft-pwa.zip
          generate_release_notes: true
