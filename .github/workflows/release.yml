name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run release:tag -- "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          GRADECRAFT_E2E_PREBUILT: "1"
      - name: Record release screenshot evidence metadata
        if: success()
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "tag=$GITHUB_REF_NAME"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          } > test-results/publication-screenshots/EVIDENCE.txt
      - name: Upload tagged publication screenshot candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots-${{ github.ref_name }}-${{ github.sha }}
          path: test-results/publication-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload release Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - run: cd dist && zip -r ../gradecraft-pwa.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: gradecraft-pwa.zip
          generate_release_notes: true
