name: Native

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icons/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/native.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/icons/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Select stable Rust
        run: rustup update stable
      - run: npm install --ignore-scripts
      - run: npm run native:icons
      - run: npm run native:check
      - name: Compile native desktop application
        run: npm run native:build -- --debug --no-bundle

  android-build:
    name: Android debug APK (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Select stable Rust
        run: rustup update stable
      - name: Select installed Android NDK
        shell: bash
        run: echo "NDK_HOME=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)" >> "$GITHUB_ENV"
      - run: npm install --ignore-scripts
      - run: npm run android:init -- --ci
      - name: Compile Android debug APK
        run: npm run android:build -- --debug --apk --target x86_64 --ci
      - name: Upload Android smoke-build APK
        uses: actions/upload-artifact@v4
        with:
          name: gradecraft-android-debug-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    name: iOS simulator build (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Select stable Rust
        run: rustup update stable
      - run: npm install --ignore-scripts
      - run: npm run ios:init -- --ci
      - name: Compile unsigned iOS simulator application
        run: npm run ios:build -- --debug --target aarch64-sim --no-sign
