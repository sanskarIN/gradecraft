name: Bug report
description: Report a reproducible GradeCraft defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real student records, secrets, or other sensitive personal data."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Choose...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GradeCraft version
      placeholder: "1.0.0"
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
